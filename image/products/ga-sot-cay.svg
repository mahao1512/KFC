<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="sauceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="40%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="sauceShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="hotShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#7f1d1d" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgHotGrad)"/>
  <circle cx="200" cy="150" r="110" fill="#dc2626" opacity="0.1"/>

  <!-- Plate -->
  <ellipse cx="200" cy="235" rx="145" ry="32" fill="#cbd5e1" opacity="0.5"/>
  <ellipse cx="200" cy="230" rx="135" ry="28" fill="#ffffff" filter="url(#hotShadow)"/>
  <ellipse cx="200" cy="230" rx="120" ry="22" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/>

  <!-- Hot Steam / Aroma -->
  <path d="M 180 50 Q 170 35 185 20" stroke="#f87171" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 210 55 Q 225 40 215 25" stroke="#f87171" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 240 60 Q 230 45 245 30" stroke="#f87171" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Chili Icon Badge -->
  <g transform="translate(320, 45) scale(0.9)">
    <circle cx="0" cy="0" r="24" fill="#dc2626"/>
    <text x="0" y="8" font-size="20" text-anchor="middle">🌶️</text>
  </g>

  <!-- Glazed Drumstick -->
  <g filter="url(#hotShadow)">
    <!-- Bone -->
    <path d="M 85 205 L 125 175" stroke="#fef3c7" stroke-width="17" stroke-linecap="round"/>
    <circle cx="80" cy="208" r="9" fill="#fde68a"/>
    <circle cx="90" cy="216" r="8" fill="#fde68a"/>

    <!-- Juicy Chicken Drumstick with Hot Sauce Glaze -->
    <path d="M 115 178 C 85 140 98 75 150 60 C 205 45 260 80 255 135 C 250 185 170 200 115 178 Z" fill="url(#sauceGrad)"/>

    <!-- Shiny Sauce Reflections -->
    <path d="M 140 85 C 165 72 205 78 220 95 C 195 85 160 85 140 85 Z" fill="#fecaca" opacity="0.6"/>
    <ellipse cx="180" cy="115" rx="25" ry="12" fill="url(#sauceShine)" opacity="0.5" transform="rotate(-15 180 115)"/>
    <ellipse cx="225" cy="135" rx="15" ry="8" fill="#fecaca" opacity="0.4" transform="rotate(20 225 135)"/>

    <!-- Spicy Glaze Drips -->
    <path d="M 135 178 C 140 195 150 195 152 178" fill="#991b1b"/>
    <path d="M 175 190 C 180 205 190 205 192 190" fill="#991b1b"/>

    <!-- Sesame Seeds Sprinkled -->
    <g fill="#ffffff">
      <ellipse cx="145" cy="100" rx="2.5" ry="4" transform="rotate(25 145 100)"/>
      <ellipse cx="170" cy="90" rx="2.5" ry="4" transform="rotate(-30 170 90)"/>
      <ellipse cx="205" cy="98" rx="2.5" ry="4" transform="rotate(15 205 98)"/>
      <ellipse cx="155" cy="125" rx="2.5" ry="4" transform="rotate(-10 155 125)"/>
      <ellipse cx="185" cy="118" rx="2.5" ry="4" transform="rotate(40 185 118)"/>
      <ellipse cx="215" cy="120" rx="2.5" ry="4" transform="rotate(-20 215 120)"/>
      <ellipse cx="170" cy="145" rx="2.5" ry="4" transform="rotate(35 170 145)"/>
      <ellipse cx="198" cy="148" rx="2.5" ry="4" transform="rotate(-45 198 148)"/>
      <ellipse cx="228" cy="142" rx="2.5" ry="4" transform="rotate(10 228 142)"/>
      <ellipse cx="150" cy="160" rx="2.5" ry="4" transform="rotate(15 150 160)"/>
      <ellipse cx="185" cy="170" rx="2.5" ry="4" transform="rotate(-15 185 170)"/>
    </g>
    <!-- Scallion green sprinkles -->
    <rect x="160" y="110" width="6" height="3" rx="1" fill="#22c55e" transform="rotate(25 160 110)"/>
    <rect x="195" y="105" width="6" height="3" rx="1" fill="#22c55e" transform="rotate(-40 195 105)"/>
    <rect x="210" y="135" width="6" height="3" rx="1" fill="#22c55e" transform="rotate(15 210 135)"/>
    <rect x="175" y="155" width="6" height="3" rx="1" fill="#22c55e" transform="rotate(60 175 155)"/>
  </g>
</svg>