<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="iceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f7"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5efe6"/>
    </linearGradient>
    <linearGradient id="syrupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#e2e8f0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="iceShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#be123c" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#iceBg)"/>
  <circle cx="200" cy="150" r="110" fill="#f43f5e" opacity="0.08"/>

  <!-- Shadow below glass -->
  <ellipse cx="200" cy="265" rx="70" ry="14" fill="#000000" opacity="0.15"/>

  <g filter="url(#iceShadow)">
    <!-- Wafer Stick -->
    <g transform="translate(145, 60) rotate(-32)">
      <rect x="0" y="0" width="12" height="110" rx="6" fill="#d97706"/>
      <!-- Striped spiral pattern on wafer -->
      <path d="M 0 25 L 12 33 M 0 45 L 12 53 M 0 65 L 12 73 M 0 85 L 12 93" stroke="#78350f" stroke-width="3"/>
    </g>

    <!-- Swirled Soft Serve Ice Cream -->
    <!-- Swirl Level 3 (Top Tip) -->
    <path d="M 195 45 C 190 35 210 32 208 45 C 215 55 185 70 195 45 Z" fill="url(#creamGrad)"/>
    <!-- Swirl Level 2 -->
    <ellipse cx="200" cy="80" rx="36" ry="24" fill="url(#creamGrad)"/>
    <!-- Swirl Level 1 (Middle) -->
    <ellipse cx="200" cy="115" rx="55" ry="32" fill="url(#creamGrad)"/>
    <!-- Swirl Base -->
    <ellipse cx="200" cy="150" rx="68" ry="38" fill="url(#creamGrad)"/>

    <!-- Strawberry Syrup Drizzle -->
    <!-- Top Drips -->
    <path d="M 190 55 C 195 50 205 50 210 55 C 205 75 212 90 200 95 C 192 90 188 75 190 55 Z" fill="url(#syrupGrad)"/>
    <!-- Flowing drips across layers -->
    <path d="M 175 80 C 180 110 165 130 170 150 C 176 130 188 115 185 85 Z" fill="url(#syrupGrad)"/>
    <path d="M 215 82 C 210 112 230 128 226 155 C 220 132 215 110 215 82 Z" fill="url(#syrupGrad)"/>
    <path d="M 190 110 C 195 135 205 145 200 170 C 196 145 192 130 190 110 Z" fill="url(#syrupGrad)"/>
    <!-- Shiny Syrup Highlights -->
    <ellipse cx="188" cy="65" rx="3" ry="8" fill="#fda4af" opacity="0.6"/>
    <ellipse cx="172" cy="115" rx="2.5" ry="10" fill="#fda4af" opacity="0.6"/>
    <ellipse cx="224" cy="120" rx="2.5" ry="12" fill="#fda4af" opacity="0.6"/>

    <!-- Strawberry Fruit on top -->
    <g transform="translate(225, 60) rotate(15) scale(0.85)">
      <path d="M 0 0 C 15 -10 25 10 10 30 C 0 35 -5 20 0 0 Z" fill="#e11d48"/>
      <!-- Seeds -->
      <circle cx="5" cy="10" r="1" fill="#fef08a"/>
      <circle cx="12" cy="15" r="1" fill="#fef08a"/>
      <circle cx="6" cy="22" r="1" fill="#fef08a"/>
      <!-- Green Leaves -->
      <path d="M 0 0 C -5 -8 -10 -2 0 0 C 5 -10 10 -5 0 0 Z" fill="#16a34a"/>
    </g>

    <!-- Glass Cup (Sundae Tulip Glass) -->
    <!-- Glass Body -->
    <path d="M 130 145 C 130 205 160 220 185 225 L 185 245 L 160 252 C 160 257 240 257 240 252 L 215 245 L 215 225 C 240 220 270 205 270 145 Z" fill="url(#glassGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Strawberry Puree at bottom of glass -->
    <path d="M 152 195 C 165 215 185 220 200 220 C 215 220 235 215 248 195 C 235 208 215 215 200 215 C 185 215 165 208 152 195 Z" fill="url(#syrupGrad)" opacity="0.85"/>

    <!-- Glass Rim Highlight -->
    <ellipse cx="200" cy="145" rx="70" ry="14" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.7"/>
    <ellipse cx="200" cy="254" rx="40" ry="6" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Glass Reflections -->
    <path d="M 145 155 C 142 185 160 208 175 215" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
</svg>