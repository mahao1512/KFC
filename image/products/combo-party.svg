<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="partyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#fef2f2"/>
    </linearGradient>
    <linearGradient id="bucketGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="75%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="chickParty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="partyShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#partyBg)"/>
  <circle cx="200" cy="150" r="115" fill="#e11d48" opacity="0.08"/>

  <!-- Party Confetti -->
  <circle cx="70" cy="70" r="4" fill="#fbbf24"/>
  <circle cx="330" cy="65" r="5" fill="#ef4444"/>
  <circle cx="95" cy="120" r="3" fill="#3b82f6"/>
  <circle cx="340" cy="130" r="4" fill="#10b981"/>
  <rect x="55" y="95" width="8" height="4" rx="2" fill="#ec4899" transform="rotate(25 55 95)"/>
  <rect x="315" y="90" width="8" height="4" rx="2" fill="#f59e0b" transform="rotate(-35 315 90)"/>

  <!-- Bottom Shadow -->
  <ellipse cx="200" cy="265" rx="130" ry="18" fill="#000000" opacity="0.15"/>

  <!-- Back Drinks (Small Pepsi) -->
  <g transform="translate(255, 120) scale(0.65)" opacity="0.95">
    <ellipse cx="60" cy="190" rx="40" ry="10" fill="#000000" opacity="0.2"/>
    <path d="M 25 35 L 35 180 C 36 185 40 188 45 188 L 75 188 C 80 188 84 185 85 180 L 95 35 Z" fill="#0066cc"/>
    <rect x="20" y="25" width="80" height="12" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
    <path d="M 58 5 L 85 -10 L 90 0 L 65 25 Z" fill="#ef4444"/>
  </g>

  <!-- Fries Packet (Left) -->
  <g transform="translate(75, 135) scale(0.7)" filter="url(#partyShadow)">
    <path d="M 15 80 L 25 180 C 26 185 30 188 35 188 L 75 188 C 80 188 84 185 85 180 L 95 80 Z" fill="#dc2626"/>
    <!-- Yellow fries poking out -->
    <rect x="25" y="20" width="8" height="65" rx="3" fill="#fbbf24" transform="rotate(-12 25 20)"/>
    <rect x="35" y="10" width="9" height="75" rx="3" fill="#f59e0b" transform="rotate(-5 35 10)"/>
    <rect x="47" y="5" width="8" height="80" rx="3" fill="#fcd34d" transform="rotate(2 47 5)"/>
    <rect x="58" y="12" width="9" height="73" rx="3" fill="#fbbf24" transform="rotate(8 58 12)"/>
    <rect x="70" y="25" width="8" height="60" rx="3" fill="#f59e0b" transform="rotate(16 70 25)"/>
  </g>

  <!-- Big Bucket (Center) -->
  <g filter="url(#partyShadow)">
    <!-- Fried chicken pieces inside bucket -->
    <!-- Chicken 1 (Left) -->
    <path d="M 140 115 C 130 95 150 75 170 85 C 185 95 175 125 150 125 Z" fill="url(#chickParty)"/>
    <circle cx="155" cy="95" r="3" fill="#fef3c7"/>
    <!-- Chicken 2 (Center High) -->
    <path d="M 175 100 C 165 70 205 60 225 80 C 235 95 220 120 190 120 Z" fill="url(#chickParty)"/>
    <circle cx="195" cy="85" r="4" fill="#fef3c7"/>
    <!-- Chicken 3 (Right) -->
    <path d="M 215 110 C 210 90 235 75 255 90 C 270 105 255 130 230 130 Z" fill="url(#chickParty)"/>
    <!-- Bone 1 poking out -->
    <path d="M 155 75 L 140 60" stroke="#fef3c7" stroke-width="8" stroke-linecap="round"/>
    <circle cx="138" cy="58" r="4.5" fill="#fde68a"/>
    <!-- Bone 2 poking out -->
    <path d="M 235 75 L 250 55" stroke="#fef3c7" stroke-width="8" stroke-linecap="round"/>
    <circle cx="253" cy="54" r="4.5" fill="#fde68a"/>

    <!-- Bucket Rim -->
    <ellipse cx="200" cy="125" rx="75" ry="16" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Bucket Body (Tapered Cylinder) -->
    <path d="M 125 125 L 145 245 C 146 250 150 255 160 255 L 240 255 C 250 255 254 250 255 245 L 275 125 Z" fill="#ffffff"/>

    <!-- Red Stripes on bucket -->
    <!-- Clip path for bucket body -->
    <g>
      <!-- Stripe 1 Left Red -->
      <path d="M 125 125 L 145 245 L 165 245 L 150 125 Z" fill="#dc2626"/>
      <!-- Stripe 2 Middle Red -->
      <path d="M 185 125 L 190 245 L 210 245 L 215 125 Z" fill="#dc2626"/>
      <!-- Stripe 3 Right Red -->
      <path d="M 250 125 L 235 245 L 255 245 L 275 125 Z" fill="#dc2626"/>
    </g>

    <!-- Bucket Bottom Rim -->
    <ellipse cx="200" cy="245" rx="48" ry="8" fill="#e2e8f0" opacity="0.5"/>

    <!-- KFC Emblem Badge on Bucket -->
    <circle cx="200" cy="185" r="26" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
    <text x="200" y="193" font-family="Impact, Arial Black, sans-serif" font-size="20" font-weight="900" fill="#dc2626" text-anchor="middle">KFC</text>
  </g>
</svg>